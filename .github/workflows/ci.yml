name: CI

# Pull requests run it directly; every push to master runs it through deploy.yml, which deploys
# only when it passes.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, types, format, unit + rules tests, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # The Firebase emulators run on Java.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      # Demo Firebase settings: every test runs against the emulators (project demo-todo).
      - name: Use the demo environment
        run: grep -vE '^[[:space:]]*(#|$)' .env.ci >> "$GITHUB_ENV"
      - run: npm ci
      - name: Cache the Firebase emulators
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      # tests/rules has its own step below, so this runs the app's unit tests only.
      - name: Unit tests
        run: npm run test -- src
      - name: Firestore security rules tests
        run: npm run test:rules
      # The demo build checks that the app builds; deploy.yml builds its own with the live config.
      - name: Production build
        run: npm run build
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=moderate

  functions:
    name: Cloud Functions (build, lint, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Use the demo environment
        run: grep -vE '^[[:space:]]*(#|$)' .env.ci >> "$GITHUB_ENV"
      # The root install provides firebase-tools, which the functions' tests start the emulator with.
      - run: npm ci
      - run: npm --prefix functions ci
      - name: Cache the Firebase emulators
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm --prefix functions run build
      - run: npm --prefix functions run lint
      - name: Unit tests (Firestore emulator)
        run: npm --prefix functions run test

  e2e:
    name: End-to-end (Playwright, Chromium + WebKit, emulators)
    # Pinned: Playwright's WebKit builds go up to Ubuntu 24.04, and on 26.04 (ubuntu-latest from
    # 2026-10-19) WebKit can't start, missing libicudata.so.74.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Use the demo environment
        run: grep -vE '^[[:space:]]*(#|$)' .env.ci >> "$GITHUB_ENV"
      - run: npm ci
      - name: Cache the Firebase emulators
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # ImageOS (ubuntu24, ...) keeps browsers built for one OS release off another.
          key: playwright-${{ env.ImageOS }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
      # The cache holds the browsers only; their system libraries are installed on every run.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
      - name: Run e2e suite against Auth + Firestore emulators
        run: npm run e2e
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The action lists a pull request's commits through the API. deploy.yml grants this to its
      # `ci` job, since a called workflow can't ask for more than its caller allows.
      pull-requests: read
    steps:
      # The whole history, so every commit in the push or pull request is scanned.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Rules: gitleaks' defaults; allowlists for reviewed findings in old history: .gitleaks.toml.
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # The version .gitleaks.toml was checked with ([[allowlists]] needs 8.25 or later).
          GITLEAKS_VERSION: 8.30.1
          # The job can't write comments (read-only token); a leak fails the job instead.
          GITLEAKS_ENABLE_COMMENTS: false
