name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Static checks, the production build, unit tests, Firestore rules tests and the Cloud Functions.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # The Firebase emulators run on Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Demo Firebase settings: every test runs against the emulators (project demo-todo).
      - name: Use the demo environment
        run: cat .env.ci >> "$GITHUB_ENV"

      - name: Install
        run: npm ci

      - name: Install (functions)
        run: npm --prefix functions ci

      - name: Cache the Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # The demo build: it checks that the app builds. Deploy builds its own with the live config.
      - name: Build
        run: npm run build

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      # tests/rules has its own step below, so this runs the app's unit tests only.
      - name: Unit tests
        run: npm run test -- src

      - name: Firestore rules tests
        run: npm run test:rules

      - name: Build (functions)
        run: npm --prefix functions run build

      - name: Lint (functions)
        run: npm --prefix functions run lint

      - name: Unit tests (functions)
        run: npm --prefix functions run test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Use the demo environment
        run: cat .env.ci >> "$GITHUB_ENV"

      - name: Install
        run: npm ci

      - name: Cache the Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      # The cache holds the browsers only; their system libraries are installed on every run.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: End-to-end tests
        run: npm run e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The action lists a pull request's commits through the API.
      pull-requests: read
    steps:
      # The whole history, so every commit in the push or pull request is scanned.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Rules: gitleaks' defaults; allowlists for reviewed findings in old history: .gitleaks.toml.
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # The version .gitleaks.toml was checked with ([[allowlists]] needs 8.25 or later).
          GITLEAKS_VERSION: 8.30.1
          # The job can't write comments (read-only token); a leak fails the job instead.
          GITLEAKS_ENABLE_COMMENTS: false
