<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1976D2" />
    <meta
      name="description"
      content="Plan your tasks, label them and get reminded before they are due."
    />
    <link rel="canonical" href="https://todo.spanion.in/" />
    <meta property="og:url" content="https://todo.spanion.in/" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/img/icons/apple-touch-icon-180x180.png" />
    <title>Task Manager</title>
    <style>
      #loading {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fafafa;
      }
      #loading > svg {
        width: 96px;
        height: auto;
        fill: #2196f3;
        animation: pulse 1.6s ease-in-out infinite;
      }
      #app:not(:empty) + #loading {
        display: none;
      }
      @keyframes pulse {
        50% {
          opacity: 0.45;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #loading > svg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <noscript>Task Manager needs JavaScript. Please enable it to continue.</noscript>
    <div id="app"></div>
    <div id="loading" aria-hidden="true">
      <svg viewBox="0 104 512 308" xmlns="http://www.w3.org/2000/svg">
        <polygon points="8,286 127.5,405.5 158,375 38.5,255.5" />
        <polygon points="218,254 248.5,284.5 384,149 353.5,118.5" />
        <polygon points="129,286 248,405 504.5,148.5 474,118 248,344 159.5,255.5" />
      </svg>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
